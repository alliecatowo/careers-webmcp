# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # Blocked upstream: eslint-config-next 16 bundles eslint-plugin-import,
  # jsx-a11y and react, whose peer ranges stop at eslint 9.
  - dependency-name: eslint
    update-types:
    - version-update:semver-major
  # Blocked upstream: typescript-eslint 8 supports typescript <6.1; with
  # TypeScript 7 (native) eslint-config-next crashes at load time.
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
